<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Vixton Labs</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="logo"><span class="dot"></span>VIXTON LABS</div>
    <p class="sub">Admin panel — sign in to manage your site.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@vixtonlabs.tech">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p class="error-msg" id="login-error"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
  // if already logged in, skip straight to dashboard
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session) window.location.href = 'dashboard.html';
  })();

  const form = document.getElementById('login-form');
  const errorMsg = document.getElementById('login-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      errorMsg.textContent = error.message;
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
